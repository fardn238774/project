<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="1050" fill="#ffffff"/>
  <rect x="24" y="24" width="752" height="1002" fill="none" stroke="#1f2937" stroke-width="2"/>

  <!-- Header -->
  <rect x="24" y="24" width="752" height="70" fill="#0f2740"/>
  <text x="48" y="56" fill="#ffffff" font-size="22" font-weight="bold">JAPAN AUTO AUCTION</text>
  <text x="48" y="80" fill="#9fc0e0" font-size="15" letter-spacing="1">VEHICLE INSPECTION SHEET / 出品票</text>
  <text x="752" y="56" fill="#ffffff" font-size="14" text-anchor="end">USS Yokohama</text>
  <text x="752" y="80" fill="#9fc0e0" font-size="13" text-anchor="end">Lot 40218 · Sample</text>

  <!-- Grade banners -->
  <rect x="48" y="118" width="220" height="120" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="158" y="150" fill="#374151" font-size="14" text-anchor="middle">OVERALL GRADE</text>
  <text x="158" y="212" fill="#0f2740" font-size="64" font-weight="bold" text-anchor="middle">4</text>

  <rect x="288" y="118" width="150" height="120" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="363" y="150" fill="#374151" font-size="14" text-anchor="middle">INTERIOR</text>
  <text x="363" y="212" fill="#0f2740" font-size="60" font-weight="bold" text-anchor="middle">B</text>

  <rect x="458" y="118" width="294" height="120" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="474" y="146" fill="#6b7280" font-size="13">Make / Model</text>
  <text x="474" y="168" fill="#111827" font-size="17" font-weight="bold">NISSAN X-TRAIL 20X</text>
  <text x="474" y="196" fill="#6b7280" font-size="13">Chassis · Year</text>
  <text x="474" y="218" fill="#111827" font-size="16" font-weight="bold">NT32-••••••  ·  2015</text>

  <!-- Spec grid -->
  <g font-size="14">
    <line x1="48" y1="270" x2="752" y2="270" stroke="#d1d5db"/>
    <text x="48" y="298" fill="#6b7280">Mileage</text>
    <text x="260" y="298" fill="#111827" font-weight="bold">110,000 km</text>
    <text x="430" y="298" fill="#6b7280">Transmission</text>
    <text x="620" y="298" fill="#111827" font-weight="bold">CVT (AT)</text>
    <line x1="48" y1="316" x2="752" y2="316" stroke="#eef0f2"/>
    <text x="48" y="344" fill="#6b7280">Displacement</text>
    <text x="260" y="344" fill="#111827" font-weight="bold">2,000 cc</text>
    <text x="430" y="344" fill="#6b7280">Fuel</text>
    <text x="620" y="344" fill="#111827" font-weight="bold">Petrol</text>
    <line x1="48" y1="362" x2="752" y2="362" stroke="#eef0f2"/>
    <text x="48" y="390" fill="#6b7280">Exterior colour</text>
    <text x="260" y="390" fill="#111827" font-weight="bold">Pearl White</text>
    <text x="430" y="390" fill="#6b7280">Equipment</text>
    <text x="620" y="390" fill="#111827" font-weight="bold">AAC · PS · PW · SR</text>
    <line x1="48" y1="408" x2="752" y2="408" stroke="#d1d5db"/>
  </g>

  <!-- Car diagram -->
  <text x="48" y="448" fill="#374151" font-size="15" font-weight="bold">CONDITION MAP (top view)</text>
  <g transform="translate(240,470)">
    <rect x="0" y="0" width="320" height="200" rx="70" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <rect x="40" y="45" width="240" height="110" rx="28" fill="#f8fafc" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="160" y1="45" x2="160" y2="155" stroke="#e5e7eb"/>
    <!-- damage marks -->
    <circle cx="70" cy="30" r="13" fill="#fde2e0" stroke="#c1442d" stroke-width="1.5"/>
    <text x="70" y="35" fill="#c1442d" font-size="12" font-weight="bold" text-anchor="middle">A1</text>
    <circle cx="255" cy="175" r="13" fill="#fdf3e3" stroke="#8a5b12" stroke-width="1.5"/>
    <text x="255" y="180" fill="#8a5b12" font-size="12" font-weight="bold" text-anchor="middle">U2</text>
    <circle cx="290" cy="70" r="13" fill="#fdf3e3" stroke="#8a5b12" stroke-width="1.5"/>
    <text x="290" y="75" fill="#8a5b12" font-size="12" font-weight="bold" text-anchor="middle">U1</text>
  </g>

  <!-- Legend -->
  <g font-size="13" transform="translate(48,700)">
    <text x="0" y="0" fill="#374151" font-weight="bold">LEGEND</text>
    <text x="0" y="26" fill="#111827"><tspan font-weight="bold" fill="#c1442d">A</tspan> = scratch   <tspan font-weight="bold" fill="#8a5b12">U</tspan> = dent   <tspan font-weight="bold">W</tspan> = repaired/wave   <tspan font-weight="bold">S</tspan> = rust</text>
    <text x="0" y="48" fill="#6b7280">Numbers 1–4 indicate size (1 = smallest).</text>
  </g>

  <!-- Inspector notes -->
  <rect x="48" y="770" width="704" height="150" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="66" y="800" fill="#374151" font-size="14" font-weight="bold">INSPECTOR NOTES</text>
  <text x="66" y="828" fill="#111827" font-size="14">• Original paint on all panels except front-left fender (A1, minor scratch).</text>
  <text x="66" y="852" fill="#111827" font-size="14">• Two small dents on tailgate and rear-right quarter (U1, U2), no rust.</text>
  <text x="66" y="876" fill="#111827" font-size="14">• Interior clean, non-smoker; all electronics functional. Timing chain OK.</text>
  <text x="66" y="900" fill="#111827" font-size="14">• Odometer verified against service book. No accident history on frame.</text>

  <text x="400" y="978" fill="#9ca3af" font-size="12" text-anchor="middle">Sample auction sheet — AutoBD demo document. Not a genuine auction record.</text>
</svg>
