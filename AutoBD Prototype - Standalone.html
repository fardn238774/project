document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"6b52fa33-f168-49a1-8d34-812a27bd351b\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet data-dc-atomics=\"\">\n<style>\n  @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }\n  @keyframes zoomPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.012); } }\n  @keyframes ringExpand { 0% { transform: scale(0.9); opacity: 0.6; } 100% { transform: scale(1.5); opacity: 0; } }\n  @keyframes bubbleRise {\n    0% { transform: translateY(0) scale(0.6); opacity: 0; }\n    12% { opacity: 0.5; }\n    85% { opacity: 0.2; }\n    100% { transform: translateY(-140px) scale(1.25); opacity: 0; }\n  }\n  .bubble { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(var(--accent-rgb),0.5), rgba(var(--accent-rgb),0.05)); pointer-events: none; animation: bubbleRise linear infinite; }\n  * { box-sizing: border-box; }\n  body { margin: 0; }\n  input[type=\"range\"] { accent-color: var(--accent); }\n  .theme-toggle { transition: background 0.3s ease; }\n  .theme-toggle:hover .toggle-knob { filter: brightness(1.08); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;--bg:{{ cBg }};--text:{{ cText }};--muted:{{ cMuted }};--dim:{{ cDim }};--border:{{ cBorder }};--card-bg:{{ cCardBg }};--track-bg:{{ cTrackBg }};--chip-bg:{{ cChipBg }};--accent:{{ cAccent }};--accent-hover:{{ cAccentHover }};--accent-rgb:{{ cAccentRgb }};--accent-tint:{{ cAccentTint }};--on-accent:{{ cOnAccent }};--ink:#1a0d0d;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:var(--text);transition:background 0.4s ease,color 0.4s ease\">\n\n  <!-- ADMIN MODE -->\n  <sc-if value=\"{{ isAdminMode }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;padding:18px 40px;background:var(--ink);border-bottom:1px solid #211d18\">\n      <div style=\"display:flex;align-items:center;gap:20px\">\n        <div style=\"font-size:22px;font-weight:800;letter-spacing:-0.02em;color:#fff\">Auto<span style=\"color:#e2765f\">BD<\u002Fspan> <span style=\"font-size:13px;font-weight:600;color:var(--dim);margin-left:6px\">Admin<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ exitAdmin }}\" style=\"font-size:13px;color:#e2e0d9;cursor:pointer;padding:8px 14px;border-radius:8px;background:var(--ink)\">← Exit admin, back to buyer view<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"max-width:1180px;margin:0 auto;padding:32px 40px 80px\">\n      <div style=\"font-size:26px;font-weight:800;margin-bottom:24px\">Platform Analytics &amp; Revenue<\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px\">\n        <div style=\"border:1px solid var(--border);border-radius:14px;padding:18px;background:#ffffff\">\n          <div style=\"font-size:24px;font-weight:800\">4,812<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--dim)\">Total active listings<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--border);border-radius:14px;padding:18px;background:#ffffff\">\n          <div style=\"font-size:24px;font-weight:800\">9,340<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--dim)\">Bids placed · 68% win rate<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--border);border-radius:14px;padding:18px;background:#ffffff\">\n          <div style=\"font-size:24px;font-weight:800\">2,610<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--dim)\">Successful imports<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--border);border-radius:14px;padding:18px;background:#ffffff\">\n          <div style=\"font-size:24px;font-weight:800\">41%<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--dim)\">Container pooling match rate<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid var(--border);border-radius:16px;background:var(--card-bg);padding:22px;margin-bottom:24px\">\n        <div style=\"font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--dim);margin-bottom:16px\">Revenue by source<\u002Fdiv>\n        <sc-for list=\"{{ revenueRows }}\" as=\"row\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:12px\">\n            <div style=\"width:170px;font-size:13px;color:var(--text)\">{{ row.label }}<\u002Fdiv>\n            <div style=\"flex:1;height:10px;background:var(--track-bg);border-radius:5px;overflow:hidden\"><div style=\"height:100%;width:{{ row.pct }}%;background:var(--accent);border-radius:5px\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"width:90px;text-align:right;font-size:13px;font-weight:700\">{{ row.value }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1.2fr 1fr;gap:20px\">\n        <div style=\"border:1px solid var(--border);border-radius:16px;background:var(--card-bg);padding:22px\">\n          <div style=\"font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--dim);margin-bottom:14px\">Pending bidding organization applications<\u002Fdiv>\n          <sc-for list=\"{{ adminPendingApps }}\" as=\"app\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--track-bg)\">\n              <div>\n                <div style=\"font-size:14px;font-weight:700\">{{ app.name }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--dim)\">License {{ app.license }} · {{ app.years }} yrs track record<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\" "{{ variants }}\" as=\"v\" hint-placeholder-count=\"3\">\n          <div sc-camel-on-click=\"{{ v.select }}\" style=\"padding:10px 16px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid {{ v.borderColor }};background:{{ v.bg }};color:{{ v.color }}\">{{ v.name }} · {{ v.price }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid var(--border);border-radius:16px;background:var(--card-bg);padding:22px;margin-bottom:18px\">\n        <div style=\"font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--dim);margin-bottom:14px\">Specifications — {{ selectedVariantObj.name }}<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px\">\n          <div><span style=\"color:var(--dim)\">Engine<\u002Fspan> · {{ selectedVariantObj.engine }}<\u002Fdiv>\n          <div><span style=\"color:var(--dim)\">Transmission<\u002Fspan> · {{ selectedVariantObj.trans }}<\u002Fdiv>\n          <div><span style=\"color:var(--dim)\">Fuel economy<\u002Fspan> · {{ selectedVariantObj.economy }}<\u002Fdiv>\n          <div><span style=\"color:var(--dim)\">Warranty<\u002Fspan> · {{ selectedNewCar.warranty }}, {{ selectedNewCar.warrantyKm }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid var(--border);border-radius:16px;background:var(--card-bg);padding:22px;margin-bottom:18px\">\n        <div style=\"font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--dim);margin-bottom:10px\">Nearest authorised service center<\u002Fdiv>\n        <div style=\"height:120px;border-radius:10px;background:repeating-linear-gradient(135deg,#eef2ee,#eef2ee 10px,#e2ebe4 10px,#e2ebe4 20px);display:flex;align-items:center;justify-content:center\">\n          <div style=\"font-family:ui-monospace,monospace;font-size:11px;color:#7a8a7d\">Google Maps — service center locator<\u002Fdiv>\n        <\u002Fdiv> Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- SCREEN: USED CAR DETAIL -->\n  <sc-if value=\"{{ isUsedCarDetail }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:900px;margin:0 auto;padding:24px 40px 100px\">\n      <div sc-camel-on-click=\"{{ goUsedCars }}\" style=\"font-size:13px;color:var(--muted);cursor:pointer;margin-bottom:18px\">← Back to used cars<\u002Fdiv>\n      <div style=\"height:220px;border-radius:14px;background:repeating-linear-gradient(135deg,#efece3,#efece3 10px,var(--border) 10px,var(--border) 20px);display:flex;align-items:center;justify-content:center;margin-bottom:18px\">\n        <div style=\"font-family:ui-monospace,monospace;font-size:12px;color:#8a8577\">listing photos — 6<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px\">\n        <div>\n          <div style=\"font-size:26px;font-weight:800;margin-bottom:4px\">{{ selectedUsedCar.title }}<\u002Fdiv>\n          <div style=\"font-size:14px;color:var(--muted)\">{{ selectedUsedCar.mileage }} km · {{ selectedUsedCar.location }} · Seller: {{ selectedUsedCar.seller }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:24px;font-weight:800;color:var(--accent)\">{{ selectedUsedCar.price }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;margin-bottom:20px\">\n        <div style=\"font-size:12px;padding:5px 10px;border-radius:7px;background:{{ selectedUsedCar.verifiedBg }};color:{{ selectedUsedCar.verifiedColor }}\">{{ selectedUsedCar.verifiedLabel }}<\u002Fdiv>\n        <div style=\"font-size:12px;padding:5px 10px;border-radius:7px;background:{{ selectedUsedCar.accidentBg }};color:{{ selectedUsedCar.accidentColor }}\">{{ selectedUsedCar.accidentLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid var(--border);border-radius:16px;background:var(--card-bg);padding:22px;margin-bottom:16px\">\n        <div style=\"font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--dim);margin-bottom:10px\">Condition notes<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.6;color:var(--text);margin-bottom:14px\">{{ selectedUsedCar.condition }}<\u002Fdiv>\n        <div style=\"font-size:13px;color:var(--muted)\">Inspection report: {{ selectedUsedCar.inspection }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid var(--border);border-radius:16px;background:var(--card-bg);padding:22px;margin-bottom:16px\">\n        <div style=\"font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--dim);margin-bottom:10px\">BRTA registration paper value<\u002Fdiv>\n        <div style=\"font-size:14px;color:var(--text);margin-bottom:10px\">{{ selectedUsedCar.brtaYears }} years import-eligible registration life remaining<\u002Fdiv>\n        <div style=\"height:8px;border-radius:4px;background:var(--track-bg);overflow:hidden\"><div style=\"height:100%;width:{{ selectedUsedCar.brtaPct }}%;background:var(--accent);border-radius:4px\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ offerSubmitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:16px;background:#f4f9f6;border:1px solid #cfe3d6;border-radius:12px;color:#2f8f5f;font-size:14px;font-weight:600\">Offer of {{ offerAmount }} sent to seller. If accepted, funds move to escrow automatically.<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ offerNotSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"border:1px solid var(--border);border-radius:16px;background:var(--card-bg);padding:22px\">\n          <div style=\"font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--dim);margin-bottom:12px\">Make an offer<\u002Fdiv>\n          <div style=\"display:flex;gap:10px\">\n            <input value=\"{{ offerAmount         <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- SCREEN: RESEARCH HUB LIST -->\n  <sc-if value=\"{{ isResearch }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:24px 40px 80px\">\n      <div style=\"font-size:30px;font-weight:800;margin-bottom:8px\">Dream Car Research Hub<\u002Fdiv>\n      <div style=\"font-size:15px;color:var(--muted);margin-bottom:28px;max-width:640px\">Specs, reliability data, and Bangladesh-specific total cost of ownership for popular JDM and BD-market models.<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px\">\n        <sc-for list=\"{{ researchModels }}\" as=\"m\" hint-placeholder-count=\"4\">\n          <div sc-camel-on-click=\"{{ m.view }}\" style=\"border:1px solid var(--border);border-radius:16px;padding:18px;background:var(--card-bg);cursor:pointer\" style-hover=\"box-shadow:0 6px 18px rgba(0,0,0,0.06)\">\n            <div style=\"height:90px;border-radius:9px;background:repeating-linear-gradient(135deg,#efece3,#efece3 10px,var(--border) 10px,var(--border) 20px);margin-bottom:12px\"><\u002Fdiv>\n            <div style=\"font-size:15px;font-weight:700\">{{ m.name }}<\u002Fdiv>\n            <div style=\"font-size:12px;color:var(--muted)\">{{ m.tagline }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- SCREEN: RESEARCH DETAIL -->\n  <sc-if value=\"{{ isResearchDetail }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:900px;margin:0 auto;padding:24px 40px 80px\">\n      <div sc-camel-on-click=\"{{ goResearch }}\" style=\"font-size:13px;color:var(--muted);cursor:pointer;margin-bottom:18px\">← Back to research hub<\u002Fdiv>\n      <div style=\"font-size:30px;font-weight:800;margin-bottom:20px\">{{ selectedResearchModel.name }}<\u002Fdiv>\n\n      <div style=\"border:1px solid var(--border);border-radius:16px;background:var(--ca km/l' },\n      { name: 'GLX', price: '৳33L', engine: '1.2L Petrol', trans: 'CVT', economy: '19 km/l' }\n    ] }\n];\n\nconst USED_CARS = [\n  { id: 'axio', title: 'Toyota Axio 2016', mileage: '92,000', location: 'Dhaka', price: '৳13.5L', seller: 'M. Rahman',\n    verified: true, verifiedLabel: 'Verified Ownership', accident: 'none', accidentLabel: 'Accident: None Found',\n    condition: 'Well-maintained, single owner. Minor bumper touch-up documented. Full service history available.',\n    inspection: 'Third-party inspection completed via partner garage, report attached.', brtaYears: '6.4', brtaPct: 64 },\n  { id: 'vezel', title: 'Honda Vezel 2017', mileage: '65,000', location: 'Chattogram', price: '৳21L', seller: 'S. Islam',\n    verified: true, verifiedLabel: 'Verified Ownership', accident: 'one', accidentLabel: '1 Incident Recorded',\n    condition: 'Rear-end collision in 2020, professionally repaired. Drives well, cosmetic panel replaced.',\n    inspection: 'Inspection report on file, visible on all future relistings.', brtaYears: '5.1', brtaPct: 51 },\n  { id: 'xtrail', title: 'Nissan X-Trail 2015', mileage: '110,000', location: 'Sylhet', price: '৳18L', seller: 'A. Karim',\n    verified: false, verifiedLabel: 'Verification Pending', accident: 'unknown', accidentLabel: 'Accident: Not Checked',\n    condition: 'Seller-reported good condition. Ownership documents under BRTA verification review.',\n    inspection: 'Not yet requested by buyer.', brtaYears: '3.8', brtaPct: 38 }\n];\n\nconst RESEARCH_MODELS = [\n  { id: 'harrier', name: 'Toyota Harrier', tagline: '60/80 series, hybrid & petrol',\n    specs: '60-series (2013–2020): 2.0L petrol / 2.0L hybrid, FWD/AWD. 80-series (2020–): redesigned platform, 2.0L hybrid standard, more advanced safety suite.',\n    issues: ['CVT judder reported on early 60-series petrol variants', 'Hybrid battery degradation after 120,000km on high-mileage imports', 'Panel gaps on aftermarket bumper replacements'],\n    regTax: '৳85,000', tokenTax: '৳12,000 / yr', insurance: '৳28,000 / yr', fuelPricePerL: 125, kmPerL: 14 },\n  { id: 'vezel', name: 'Honda Vezel', tagline: 'Compact hybrid crossover',\n    specs: 'Gen 1 (2013–2018): 1.5L hybrid, well-suited to city driving. Gen 2 (2021–): larger footprint, upgraded hybrid system, more BD imports arriving.',\n    issues: ['Gen 1 hybrid IPU cooling fan wear', 'Squeaky rear suspension on high-mileage units', 'Infotainment unit failures in humid climates'],\n    regTax: '৳62,000', tokenTax: '৳9,000 / yr', insurance: '৳21,000 / yr', fuelPricePerL: 125, kmPerL: 18 },\n  { id: 'cx5', name: 'Mazda CX-5', tagline: 'Petrol/diesel mid-size SUV',\n    specs: 'KE (2012–2016) and KF (2017–) generations. SkyActiv petrol dominant in BD imports; diesel rare due to parts availability.',\n    issues: ['Timing chain rattle on early SkyActiv-G engines', 'Infotainment dial (Mazda Connect) failures', 'Rust on rear wheel arches in coastal-import units'],\n    regTax: '৳95,000', tokenTax: '৳14,000 / yr', insurance: '৳31,000 / yr', fuelPricePerL: 125, kmPerL: 12 },\n  { id: 'premio', name: 'Toyota Premio', tagline: 'Sedan, strong resale value',\n    specs: 'T260 generation (2007–2021), 1.5L/1.8L petrol. Long production run means excellent parts availability in BD.', \n    issues: ['Oil consumption on high-mileage 1.8L units', 'Power window regulator wear', 'AC compressor clutch failure common past 100,000km'],\n    regTax: '৳58,000', tokenTax: '৳8,000 / yr', insurance: '৳19,000 / yr', fuelPricePerL: 125, kmPerL: 16 }\n];\n\nconst MOD_PARTS = [\n  { id: 'rays', name: 'Rays TE37 18\"', category: 'Wheels', price: '৳1,85,000', compatible: true },\n  { id: 'rocketbunny', name: 'Rocket Bunny Body Kit', category: 'Body kit', price: '৳3,20,000', compatible: true },\n  { id: 'led', name: 'LED Headlight Kit', category: 'Lighting', price: '৳45,000', compatible: true },\n  { id: 'bbs', name: 'BBS LM 19\"', category: 'Wheels', price: '৳2,40,000', compatible: false },\n  { id: 'kuhl', name: 'Kuhl Racing Kit', category: 'Body kit', price: '৳4,10,000', compatible: false }\n];\n\nconst EXCHANGE_RATE = 0.79;\n\nconst THEMES = {\n  light: {\n    bg: '#f7f4ee', text: '#211d18', muted: '#6f6a60', dim: '#a39d90',\n    border: '#e6e1d6', cardBg: '#ffffff', trackBg: '#f0ede5', chipBg: '#f2efe8',\n    accent: '#c1442d', accentHover: '#9c3520', accentRgb: '193,68,45', onAccent: '#ffffff',\n    accentTint: '#fbeeea'\n  },\n  dark: {\n    bg: '#0a0a0a', text: '#f3f2ee', muted: '#a9a49a', dim: '#7d786f',\n    border: 'rgba(255,255,255,0.1)', cardBg: '#1c1812', trackBg: 'rgba(255,255,255,0.08)', chipBg: 'rgba(255,255,255,0.06)',\n    accent: '#e3f23a', accentHover: '#eef874', accentRgb: '227,242,58', onAccent: '#0a0a0a',\n    accentTint: 'rgba(227,242,58,0.14)'\n  }\n};\n\nclass Component extends DCLogic {\n  state = {\n    mode: 'buyer',\n    theme: 'light',\n    screen: 'login',\n    selectedAgentId: null,\n    bidJPY: 685000,\n    timerSeconds: 272,\n    activeBidders: 4,\n    poolJoined: false,\n    exchangeRate: EXCHANGE_RATE,\n    chatMessages: [\n      { from: 'agent', text: 'Lot confirmed — Harrier Hybrid, grade 4.5B. Bidding opens now.' },\n      { from: 'buyer', text: 'Looks good, keep me updated.' }\n    ],\n    regRole: 'buyer',\n    loggedIn: false,\n    pendingScreen: null,\n    newCarId: 'corolla-cross',\n    variantIndex: 0,\n    inquirySubmitted: false,\n    usedCarId: 'axio',\n    offerAmount: '',\n    offerSubmitted: false,\n    myListings: [\n      { title: 'Toyota Axio 2016', status: 'Active', statusBg: '#f2efe8', statusColor: '#3d3830', offers: 2, price: '৳13.5L' },\n      { title: 'Honda Fit 2014', status: 'Offer Received', statusBg: '#fdf1de', statusColor: '#a3701c', offers: 1, price: '৳9.2L' },\n      { title: 'Toyota Allion 2012', status: 'Sold', statusBg: '#f4f9f6', statusColor: '#2f8f5f', offers: 4, price: '৳7.8L' }\n    ],\n    researchId: 'harrier',\n    monthlyKm: 1200,\n    aiMessages: [\n      { from: 'buyer', text: 'I want a fuel-efficient family car under 25 lakh taka, preferably Japanese, good for Dhaka traffic.' },\n      { from: 'ai', text: 'Based on that, here are three ranked options: 1) Used Honda Vezel 2017 (৳21L) — best fuel economy in city stop-go traffic, but carries 1 recorded incident. 2) Used Toyota Axio 2016 (৳13.5L) — lower upfront cost, clean accident history, less cabin space. 3) Reconditioned Toyota Corolla Axio via auction — potential for lower landed cost if you can wait ~35 days for import. Trade-off: the Vezel has lower fuel cost but higher parts cost in BD versus the Axio.' }\n    ],\n    fitmentFilter: true,\n    modBundle: [],\n    escrowStatus: 'held',\n    shipmentStageIndex: 2,\n    ratingDims: { comm: 4, grading: 4, timeliness: 4, value: 4 },\n    ratingSubmitted: false,\n    disputeOpen: false,\n    disputeSubmitted: false,\n    adminPendingApps: [\n      { name: 'Chattogram Auction Partners', license: 'JP-BD-0610', years: 2 },\n      { name: 'Sylhet Import Alliance', license: 'JP-BD-0625', years: 1 }\n    ]\n  };\n\n  componentDidMount() {\n    try {\n      const saved = localStorage.getItem('autobd-app-theme');\n      if (saved === 'dark' || saved === 'light') this.setState({ theme: saved });\n    } catch (e) {}\n\n    this._tick = setInterval(() => {\n      this.setState(s => {\n        let timerSeconds = s.timerSeconds - 1;\n        let bidJPY = s.bidJPY;\n        let activeBidders = s.activeBidders;\n        let chatMessages = s.chatMessages;\n        let exchangeRate = +(EXCHANGE_RATE + (Math.random() - 0.5) * 0.004).toFixed(4);\n\n        if (timerSeconds <= 0) {\n          timerSeconds = 240 + Math.floor(Math.random() * 60);\n          bidJPY = bidJPY + (15000 + Math.floor(Math.random() * 25000));\n          chatMessages = chatMessages.concat([{ from: 'agent', text: 'Bid now at ¥' + bidJPY.toLocaleString('en-US') + ' — still within range?' }]).slice(-6);\n        }\n        if (Math.random() < 0.3) {\n          activeBidders = Math.max(3, Math.min(7, activeBidders + (Math.random() < 0.5 ? -1 : 1)));\n        }\n        return { timerSeconds, bidJPY, activeBidders, exchangeRate, chatMessages };\n      });\n    }, 1000);\n  }\n\n  componentWillUnmount() {\n    clearInterval(this._tick);\n  }\n\n  toggleTheme = () => {\n    this.setState(s => {\n      const next = s.theme === 'dark' ? 'light' : 'dark';\n      try { localStorage.setItem('autobd-app-theme', next); } catch (e) {}\n      return { theme: next };\n    });\n  };\n\n  go = (screen) => this.setState({ screen });\n  goHome = () => this.setState({ screen: 'home', mode: 'buyer' });\n  goProfile = () => this.setState({ screen: 'profile' });\n  gated = (screen) => () => {\n    if (this.state.loggedIn) this.setState({ screen });\n    else this.setState({ screen: 'login', pendingScreen: screen });\n  };\n  goAgents = this.gated('agents');\n  goNewCars = this.gated('newcars');\n  goUsedCars = this.gated('usedcars');\n  goModStudio = this.gated('modstudio');\n  goResearch = () => this.setState({ screen: 'research' });\n  goAI = () => this.setState({ screen: 'ai' });\n  goLogin = () => this.setState({ screen: 'login' });\n  goSellerDashboard = () => this.setState({ screen: 'seller-dashboard' });\n  goAdmin = () => this.setState({ mode: 'admin' });\n  exitAdmin = () => this.setState({ mode: 'buyer', screen: 'home' });\n  goShipment = () => this.setState({ screen: 'shipment' });\n  goRating = () => this.setState({ screen: 'rating' });\n\n  selectAgentAndProfile(id) { this.setState({ screen: 'profile', selectedAgentId: id }); }\n  startBidding = () => this.setState({ screen: 'bidding' });\n  togglePool = () => this.setState(s => ({ poolJoined: !s.poolJoined }));\n\n  quickBidSmall = () => {\n    this.setState(s => ({\n      bidJPY: s.bidJPY + 25000,\n      chatMessages: s.chatMessages.concat([{ from: 'buyer', text: 'Go ahead, +¥25,000.' }, { from: 'agent', text: 'Bidding it now.' }]).slice(-6)\n    }));\n  };\n  quickBidCeiling = () => {\n    this.setState(s => ({\n      bidJPY: Math.max(s.bidJPY, 800000),\n      chatMessages: s.chatMessages.concat([{ from: 'buyer', text: 'Go up to ¥800,000 if needed.' }, { from: 'agent', text: 'Understood — ceiling set at ¥800,000.' }]).slice(-6)\n    }));\n  };\n  winLot = () => this.setState({ screen: 'escrow', escrowStatus: 'held' });\n  payEscrow = () => this.setState({ escrowStatus: 'paid' });\n\n  advanceShipment = () => this.setState(s => ({ shipmentStageIndex: Math.min(7, s.shipmentStageIndex + 1) }));\n\n  setRoleBuyer = () => this.setState({ regRole: 'buyer' });\n  setRoleOrg = () => this.setState({ regRole: 'org' });\n  setRoleAdmin = () => this.setState({ regRole: 'admin' });\n  submitRegistration = () => {\n    if (this.state.regRole === 'admin') { this.setState({ mode: 'admin', screen: 'home', loggedIn: true, pendingScreen: null }); }\n    else { this.setState(s => ({ screen: s.pendingScreen || 'home', mode: 'buyer', loggedIn: true, pendingScreen: null })); }\n  };\n\n  submitInquiry = () => this.setState({ inquirySubmitted: true });\n  selectVariant(i) { this.setState({ variantIndex: i }); }\n\n  setOfferAmount = (e) => this.setState({ offerAmount: e.target.value });\n  submitOffer = () => this.setState({ offerSubmitted: true });\n\n  setMonthlyKm = (e) => this.setState({ monthlyKm: +e.target.value });\n\n  toggleFitmentFilter = () => this.setState(s => ({ fitmentFilter: !s.fitmentFilter }));\n  toggleModBundle(id) {\n    this.setState(s => ({\n      modBundle: s.modBundle.includes(id) ? s.modBundle.filter(x => x !== id) : s.modBundle.concat(id)\n    }));\n  }\n\n  askAI(topic) {\n    const responses = {\n      family: 'For a growing family, prioritize the Xpander (7-seat, ৳38L new) or a used Honda Vezel for city efficiency. Both fit your budget with room for the landed-cost calculator to confirm total on-road price.',\n      cheapest: 'Lowest total cost of ownership in your range is the used Toyota Axio 2016 at ৳13.5L — clean accident history, strong parts availability, and lower annual token tax than the SUV options.'\n    };\n    this.setState(s => ({\n      aiMessages: s.aiMessages.concat([\n        { from: 'buyer', text: topic === 'family' ? 'What about something bigger for a family of 5?' : 'Which option has the lowest total cost of ownership?' },\n        { from: 'ai', text: responses[topic] }\n      ])\n    }));\n  }\n\n  setRatingDim(key, val) {\n    this.setState(s => ({ ratingDims: { ...s.ratingDims, [key]: val } }));\n  }\n  submitRating = () => this.setState({ ratingSubmitted: true });\n  openDispute = () => this.setState({ disputeOpen: true });\n  submitDispute = () => this.setState({ disputeSubmitted: true });\n\n  approveApp(name) {\n    this.setState(s => ({ adminPendingApps: s.adminPendingApps.filter(a => a.name !== name) }));\n  }\n  rejectApp(name) {\n    this.setState(s => ({ adminPendingApps: s.adminPendingApps.filter(a => a.name !== name) }));\n  }\n\n  fmt(n) { return Math.round(n).toLocaleString('en-US'); }\n  formatTimer(s) { const m = Math.floor(s / 60); const sec = s % 60; return m + ':' + (sec < 10 ? '0' : '') + sec; }\n\n  navStyle(active) {\n    return active\n      ? { color: '#c1442d', bg: '#fbeeea', weight: '700' }\n      : { color: '#3d3830', bg: 'transparent', weight: '400' };\n  }\n\n  renderVals() {\n    const mode = this.state.mode;\n    const screen = this.state.screen;\n\n    const agents = AGENTS.map(a => ({ ...a, viewProfile: () => this.selectAgentAndProfile(a.id) }));\n    const selectedAgent = AGENTS.find(a => a.id === this.state.selectedAgentId) || AGENTS[0];\n\n    const bidJPY = this.state.bidJPY;\n    const rate = this.state.exchangeRate;\n    const bidBDT = bidJPY * rate;\n    const duty = bidBDT * 1.10;\n    const shippingBase = 195000;\n    const shipping = this.state.poolJoined ? shippingBase * 0.7 : shippingBase;\n    const agentFee = bidBDT * 0.03;\n    const portHandling = 42000;\n    const total = bidBDT + duty + shipping + agentFee + portHandling;\n\n    const chatMessages = this.state.chat
